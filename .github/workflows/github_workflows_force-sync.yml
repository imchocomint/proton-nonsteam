name: Force sync (overwrite all)

on:
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: 'Confirm overwriting all files (except .github folder)'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:
  force-sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate confirmation
      if: github.event.inputs.confirm_overwrite != 'yes'
      run: |
        echo "Force sync cancelled - confirmation not provided"
        exit 1

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Define git user
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Fetch upstream
      run: |
        git remote add upstream https://github.com/ValveSoftware/Proton.git || true
        git fetch upstream bleeding-edge

    - name: Force overwrite files from upstream
      run: |
        # Get list of all files from upstream
        git ls-tree -r --name-only upstream/bleeding-edge | while read file; do
          # Skip .github folder entirely
          if [[ "$file" != .github/* ]]; then
            git checkout upstream/bleeding-edge -- "$file" || {
              echo "Warning: Could not checkout $file from upstream"
              continue
            }
          fi
        done

    - name: Update submodules
      run: |
        # Remove any conflicted submodule entries
        git clean -fd || true
        git submodule sync --recursive
        git submodule update --init --recursive
        
        # Force checkout submodules from upstream
        git checkout upstream/bleeding-edge -- dxvk vkd3d-proton FEX wine vkd3d dxvk-nvapi || {
          echo "Warning: Some submodules could not be checked out"
        }

    - name: Handle orphaned local files
      run: |
        # Remove any files that exist locally but not in upstream (except .github)
        git diff --name-only --diff-filter=D upstream/bleeding-edge | while read file; do
          if [[ "$file" != .github/* ]] && [ -f "$file" ]; then
            rm -f "$file"
            git rm --force "$file" || true
          fi
        done

    - name: Commit and push
      run: |
        # Check if there are any changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git add -A -- ':!.github'
          git commit -m "Force sync: overwrite all files from upstream/bleeding-edge.nThis commit forcefully syncs all files from upstream except the .github folder. Generated by force-sync workflow."
          git push origin HEAD:bleeding-edge
          echo "Force sync completed successfully"
        fi

    - name: Report status
      if: always()
      run: |
        echo "## Force Sync Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: bleeding-edge" >> $GITHUB_STEP_SUMMARY
        echo "- Source: upstream/bleeding-edge" >> $GITHUB_STEP_SUMMARY
        echo "- Protected folder: .github/" >> $GITHUB_STEP_SUMMARY
        echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY