name: Build and Release Proton

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: false # We handle submodules manually to fix the URL bug

      - name: Fix Submodule URLs & Sync
        run: |
          sed -i 's|url = ../|url = https://github.com/ValveSoftware/|g' .gitmodules
          git submodule update --init --recursive

      - name: Configure & Build
        run: |
          chmod +x configure.sh
          # 1. Create a build directory
          mkdir build
          
          # 2. Go INTO the build directory
          cd build
          
          # 3. Run the script from there (it will populate the current 'build' folder)
          ../configure.sh --build-name="nonsteam-${{ github.ref_name }}"
          
          # 4. Now run make inside this folder
          make redist

      - name: Create Tarball
        run: |
          # 1. Verify the folder exists before trying to zip it
          if [ -d "$GITHUB_WORKSPACE/build/redist" ]; then
            echo "✅ Found redist folder at $GITHUB_WORKSPACE/build/redist"
            # 2. Use the absolute path to create the tarball
            tar -czf proton-nonsteam-${{ github.ref_name }}.tar.gz -C "$GITHUB_WORKSPACE/build/redist" .
          else
            echo "❌ ERROR: redist folder not found!"
            echo "Contents of $GITHUB_WORKSPACE/build/:"
            ls -R "$GITHUB_WORKSPACE/build/"
            exit 1
          fi

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        with:
          files: proton-nonsteam-${{ github.ref_name }}.tar.gz
          # Add this line to handle manual runs
          tag_name: "nonsteam-build-${{ github.run_number }}" 
          body: "Nonsteam Build"
