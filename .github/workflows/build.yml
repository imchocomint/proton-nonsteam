name: Build and Release Proton

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: false # We handle submodules manually to fix the URL bug

      - name: Fix Submodule URLs & Sync
        run: |
          sed -i 's|url = ../|url = https://github.com/ValveSoftware/|g' .gitmodules
          git submodule update --init --recursive

      - name: Configure & Build
        run: |
          chmod +x configure.sh
          # Create build dir outside source to avoid "Not a directory" errors
          mkdir ../proton_build
          ./configure.sh --build-name="Proton-${{ github.ref_name }}" --build-dir="../proton_build"
          cd ../proton_build
          make redist

      - name: Create Tarball
        run: |
          tar -czf proton-custom-${{ github.ref_name }}.tar.gz -C ../proton_build/redist .

      - name: Generate Release
        uses: softprops/action-gh-release@v2
        with:
          files: proton-custom-${{ github.ref_name }}.tar.gz
          body: "Custom Proton build for ${{ github.ref_name }}"
